<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HEPA Hello World</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1a1a2e" />
<link rel="icon" href="icons/icon-192.png" />
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a2e;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    min-height: 100vh;
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 0.5rem;
  }
  p {
    color: #a0a0b0;
    margin-top: 0;
  }
  #status {
    margin-top: 2rem;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    background: #2d2d44;
  }
  #status.online { background: #1f5c3e; }
  #status.offline { background: #5c1f1f; }
  button {
    margin-top: 2rem;
    padding: 12px 24px;
    font-size: 1rem;
    border: none;
    border-radius: 12px;
    background: #4f6df5;
    color: white;
    cursor: pointer;
  }
  button:active { opacity: 0.8; }
  #counter { font-size: 1.1rem; margin-top: 0.5rem; }
</style>
</head>
<body>
  <h1>👋 Hello World</h1>
  <p>HEPA install pipeline test — safe to delete once the real app replaces it.</p>
  <div id="status">Checking status…</div>
  <button id="btn">Taps: <span id="counter">0</span></button>

  <script>
    const statusEl = document.getElementById('status');
    function updateStatus() {
      if (navigator.onLine) {
        statusEl.textContent = '🟢 Online';
        statusEl.className = 'online';
      } else {
        statusEl.textContent = '🔴 Offline (app still works!)';
        statusEl.className = 'offline';
      }
    }
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();

    let count = Number(localStorage.getItem('count') || 0);
    const counterEl = document.getElementById('counter');
    counterEl.textContent = count;
    document.getElementById('btn').addEventListener('click', () => {
      count++;
      counterEl.textContent = count;
      localStorage.setItem('count', count);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
